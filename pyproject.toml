[project]
name = "leyla"
version = "1.0.0"
description = "Leyla — a private, expressive Discord AI companion"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
